[package]
name = "winperf-report"
description = "Axum-based browser reporting service (read-only over the shared database)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "winperf-report"
path = "src/main.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
winperf-core = { path = "../winperf-core" }
winperf-storage = { path = "../winperf-storage" }

[lints]
workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
