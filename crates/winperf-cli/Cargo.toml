[package]
name = "winperf-cli"
description = "winperf command-line interface and Ratatui terminal UI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "winperf"
path = "src/main.rs"

[dependencies]
winperf-core = { path = "../winperf-core" }
winperf-windows = { path = "../winperf-windows" }
winperf-storage = { path = "../winperf-storage" }
winperf-runtime = { path = "../winperf-runtime" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
ratatui = "0.30"
windows-service = "0.8"

[lints]
workspace = true
