[package]
name = "winperf-windows"
description = "Windows API access (the only crate permitted to use unsafe)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
winperf-core = { path = "../winperf-core" }
winreg = "0.56"
ferrisetw = "1.2"
windows = { version = "0.62", features = [
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
] }

[lints.rust]
# Windows FFI lives here (the only crate allowed unsafe); clippy enforces a SAFETY comment on each block.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
